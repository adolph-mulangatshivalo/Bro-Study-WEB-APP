<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bro, Study!</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Load TensorFlow.js and COCO-SSD Model -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading" class="active">
    <div class="spinner"></div>
    <h2 style="font-size: 1.5rem; color: var(--accent-color);">Loading AI Engine...</h2>
    <p style="color: gray; margin-top: 10px;">Please allow webcam access.</p>
  </div>

  <!-- Launcher Screen -->
  <div id="launcher">
    <div class="glass-card">
      <h1 class="title">BRO, STUDY!</h1>
      <p class="subtitle">The ultimate chaotic study enforcer. Turn on your webcam and keep your phone out of sight.</p>
      <button id="start-btn" class="start-btn">START STUDYING</button>
    </div>
  </div>

  <!-- Timer Widget -->
  <div id="timer-widget" class="hidden">
    <div class="timer-label">FOCUS TIME</div>
    <div id="study-timer">00:00:00</div>
  </div>

  <!-- Main Monitor Layout -->
  <div id="monitor-container">
    
    <div id="study-instructions">
      <div class="instruction-block">Minimize this window using the minimize button (-) and start studying!</div>
    </div>

    <!-- Right Split: The Meme Canvas Punishment -->
    <div id="meme-canvas"></div>

  </div>

  <!-- Webcam Feed (Always visible in bottom right corner) -->
  <div id="webcam-container" class="hidden">
    <video id="webcam" autoplay playsinline muted></video>
    <canvas id="canvas-overlay"></canvas>
    
    <!-- Hidden elements for Flipped PiP (Must be technically "visible" but behind other things) -->
    <canvas id="pip-canvas" style="position: absolute; z-index: -2; opacity: 0.1;"></canvas>
    <video id="pip-video" autoplay playsinline muted autopictureinpicture style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none; opacity: 0.1;"></video>
    
    <div id="status-badge" class="status-badge">STUDYING</div>
  </div>

  <!-- Audio Player -->
  <audio id="punishment-audio" preload="auto"></audio>

  <!-- Load dynamic assets (generated by script) -->
  <script src="assets.js"></script>
  
  <!-- Main Application Logic -->
  <script src="app.js"></script>
</body>
</html>
